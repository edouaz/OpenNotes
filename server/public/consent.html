<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenNotes authorization</title></head><body>
<main><h1>OpenNotes authorization</h1><p id="message" role="status"></p><form id="login" hidden><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><section id="consent" hidden><p id="client"></p><p id="scopes"></p><p>This client may read and modify your synced notebooks and attachments.</p><button id="approve">Allow</button><button id="deny">Deny</button></section></main>
<script src="/oauth/supabase.js"></script><script src="/oauth/consent.js"></script></body></html>
